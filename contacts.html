<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти — Інженерія програмного забезпечення</title>
    <link rel="shortcut icon" href="./image/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="wrapper">
            <div class="header_wrapper">
                <div class="wrapper_logo">
                    <a href="./index.html" class="wrapper_logo-link">
                        <img src="./image/logo.png" alt="logo" width="64" height="64" class="wrapper_logo-pic">
                    </a>
                </div>
                <nav class="header_nav">
                    <ul class="header_list-menu">
                        <li class="header_item">
                            <a href="./index.html" class="header_link">Головна</a>
                        </li>
                        <li class="header_item">
                            <a href="./news.html" class="header_link">Новини</a>
                        </li>
                        <li class="header_item dropdown">
                            <a href="./education.html" class="header_link">Навчання ▾</a>
                            <ul class="submenu">
                                <li><a href="./education.html#schedule">Розклад занять</a></li>
                            </ul>
                        </li>
                        <li class="header_item">
                            <a href="./contacts.html" class="header_link">Контакти</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h1>Зворотний зв'язок</h1>
        <hr>
        <form action="#" method="post" class="contact-form">
            <div class="form-group">
                <label for="user-name">Ім'я</label>
                <input type="text" id="user-name" name="name" placeholder="Введіть ім'я" required>
            </div>

            <div class="form-group">
                <label for="user-email">Email</label>
                <input type="email" id="user-email" name="email" placeholder="Введіть ваш email" required>
            </div>

            <div class="form-group">
                <label for="user-message">Повідомлення</label>
                <textarea id="user-message" name="message" rows="5" placeholder="Введіть ваше повідомлення" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Надіслати</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Кафедра інженерії програмного забезпечення.</p>
    </footer>

</body>
</html>
